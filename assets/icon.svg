<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Source of truth for every icon size. Deliberately built from a few bold
       shapes: the previous icons were downscales of a detailed illustration,
       which read fine at 128px but turned to mush at the 16/32px sizes the
       Outlook ribbon uses, so the ribbon and the install dialog looked like
       two different add-ins. Render with scripts/build-icons.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b88d8"/>
      <stop offset="1" stop-color="#0f4b8f"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- calendar hangers -->
  <rect x="40" y="18" width="11" height="22" rx="5.5" fill="#ffffff"/>
  <rect x="77" y="18" width="11" height="22" rx="5.5" fill="#ffffff"/>

  <!-- calendar card -->
  <rect x="22" y="28" width="84" height="80" rx="12" fill="#ffffff"/>
  <path d="M22 40a12 12 0 0 1 12-12h60a12 12 0 0 1 12 12v10H22z" fill="#0f4b8f"/>

  <!-- plus: thin, long arms so it reads as "+" and not as a cross badge -->
  <rect x="58.5" y="58" width="11" height="42" rx="2.5" fill="#0f6cbd"/>
  <rect x="43" y="73.5" width="42" height="11" rx="2.5" fill="#0f6cbd"/>
</svg>
