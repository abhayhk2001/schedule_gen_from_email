<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Event Extractor</title>
    <link rel="icon" href="assets/icon-32.png" />
    <link rel="stylesheet" href="app.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  </head>
  <body>
    <header class="app-header">
      <img class="app-icon" src="assets/icon-64.png" alt="" width="28" height="28" />
      <div class="app-heading">
        <h1>Event Extractor</h1>
        <p class="subtitle">Extract calendar events from this email.</p>
      </div>
      <button
        id="theme-toggle"
        class="icon-btn"
        type="button"
        aria-label="Toggle theme"
        title="Switch theme"
      >
        <span id="theme-icon"></span>
      </button>
    </header>

    <main>
      <div class="actions">
        <button id="extract-btn" class="primary" type="button">
          Extract events from this email
        </button>
      </div>

      <section id="status" class="status hidden" aria-live="polite"></section>

      <section id="results" class="results hidden">
        <div id="empty" class="empty hidden"></div>

        <section class="event-section hidden" id="upcoming-section">
          <h2>Upcoming events</h2>
          <div class="events-list" id="events-upcoming"></div>
          <button id="create-upcoming-btn" class="primary create hidden" type="button">
            Create in calendar
          </button>
        </section>

        <section class="event-section past hidden" id="past-section">
          <h2>Past events</h2>
          <div class="events-list" id="events-past"></div>
          <button id="create-past-btn" class="primary create hidden" type="button">
            Create in calendar
          </button>
        </section>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
