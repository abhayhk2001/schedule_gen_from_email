<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Email Event Extractor</title>
    <link rel="stylesheet" href="app.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Event Extractor</h1>
      <p class="subtitle">Extract calendar events from this email.</p>
    </header>

    <main>
      <button id="extract-btn" class="primary" type="button">
        Extract events from this email
      </button>

      <button id="create-btn" class="primary create hidden" type="button">
        Create in calendar
      </button>

      <section id="status" class="status hidden" aria-live="polite"></section>

      <section id="results" class="results hidden">
        <h2 id="results-heading">Events</h2>
        <div id="events"></div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
