<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Cal Event</title>
    <link rel="stylesheet" href="app.css" />
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  </head>
  <body>
    <header class="app-header">
      <h1>Add Cal Event</h1>
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle theme"
        title="Switch theme"
      >
        <span id="theme-icon"></span>
      </button>
      <p class="subtitle">Extract calendar events from this email and add them to your calendar.</p>
    </header>

    <main>
      <button id="extract-btn" class="primary" type="button">
        Extract events from this email
      </button>

      <button id="create-btn" class="primary create hidden" type="button">
        Create in calendar
      </button>

      <section id="status" class="status hidden" aria-live="polite"></section>

      <section id="results" class="results hidden">
        <h2 id="results-heading">Events</h2>
        <div id="events"></div>
      </section>

      <section id="debug" class="debug hidden" aria-label="Debug log">
        <header class="debug-head">
          <h2>Debug</h2>
          <div class="debug-actions">
            <button id="test-sso-btn" class="debug-btn" type="button" title="Call getAccessToken only; no Graph POST">
              Test SSO
            </button>
            <button id="copy-log-btn" class="debug-btn" type="button" title="Copy log entries to clipboard">
              Copy log
            </button>
            <button id="clear-log-btn" class="debug-btn" type="button" title="Clear log">
              Clear
            </button>
          </div>
        </header>
        <ol id="log" class="log"></ol>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
