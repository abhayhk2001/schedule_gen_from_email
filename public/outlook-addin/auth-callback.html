<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Cal Event — auth callback</title>
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
      :root { color-scheme: light dark; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        max-width: 520px;
        margin: 36px auto;
        padding: 0 20px;
        color: #252423;
        background: #ffffff;
      }
      h1 { font-size: 16px; margin: 0 0 10px; }
      code { background: rgba(0,0,0,.06); padding: 0 .35em; border-radius: 4px; font-size: 12px; }
      .row { margin-top: 14px; }
      .muted { color: #605e5c; }
      @media (prefers-color-scheme: dark) {
        body { background: #1f1f1f; color: #f0f0f0; }
        code { background: rgba(255,255,255,.10); }
        .muted { color: #b3b3b3; }
      }
    </style>
  </head>
  <body>
    <h1 id="title">Finishing sign-in…</h1>
    <p id="body" class="muted">
      You can close this window if it does not close automatically.
    </p>
    <div class="row">
      <p id="detail" class="muted" style="font-family: ui-monospace, SFMono-Regular, monospace; font-size: 12px; word-break: break-all;"></p>
    </div>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error");
        var errorDescription = params.get("error_description") || "";
        var state = params.get("state") || "";

        var titleEl = document.getElementById("title");
        var bodyEl = document.getElementById("body");
        var detailEl = document.getElementById("detail");

        // The pane holds the expected state in a module variable and checks it
        // when this payload arrives, so there is nothing to validate here.
        var payload;
        if (error) {
          if (titleEl) titleEl.textContent = "Sign-in cancelled";
          if (bodyEl) bodyEl.textContent =
            error === "access_denied"
              ? "You cancelled sign-in. Close this window and try again."
              : "Microsoft Entra rejected the request.";
          if (detailEl) detailEl.textContent =
            "error=" + error + " description=" + errorDescription;
          payload = { ok: false, error: error, error_description: errorDescription, state: state };
        } else if (!code) {
          if (titleEl) titleEl.textContent = "Auth callback received no code";
          if (bodyEl) bodyEl.textContent =
            "This page is the auth callback for Add Cal Event. If you reached it directly, you can close this window.";
          if (detailEl) detailEl.textContent = window.location.href;
          payload = { ok: false, error: "missing_code", state: state };
        } else {
          if (titleEl) titleEl.textContent = "Signed in. Returning to the add-in…";
          payload = { ok: true, code: code, state: state };
        }

        function fail(reason) {
          if (titleEl) titleEl.textContent = "Could not return to the add-in";
          if (bodyEl) bodyEl.textContent =
            "Sign-in finished, but this window could not hand the result back to Outlook. Close it and try again.";
          if (detailEl) detailEl.textContent = reason;
        }

        // messageParent is the whole point of this page: it delivers the code
        // straight into the task pane, so the result never has to travel
        // through storage or another browser.
        if (typeof Office === "undefined" || !Office.onReady) {
          fail("office.js did not load in this dialog.");
          return;
        }

        Office.onReady(function () {
          try {
            Office.context.ui.messageParent(JSON.stringify(payload));
          } catch (e) {
            fail("messageParent threw: " + (e && e.message ? e.message : String(e)));
          }
        });
      })();
    </script>
  </body>
</html>
